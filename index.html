<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Test Farmacoterapia</title>
<meta name="description" content="Test de estudio del 1er parcial de Farmacoterapia veterinaria, por temas, con repaso, apuntes y modo consulta.">
<meta name="theme-color" content="#f6efe3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1f1a16" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Farmaco Test">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#f6efe3; --surface:#fffaf1; --surface-2:#f0e5d3; --text:#3d2e22; --muted:#85705d; --border:#e2d3bb;
  --accent:#c8643b; --accent-press:#9e4a28; --accent-ink:#fffaf1; --accent-soft:#f6dccb;
  --ok:#5f8a55; --ok-soft:#e3ecd8; --bad:#b84a3a; --bad-soft:#f6dcd5; --warn:#94650f; --warn-soft:#f7e8c4;
  --ink:#4a3426; --dots:rgba(120,90,60,.07); --lift:0 3px 0 rgba(74,52,38,.12);
  --serif:"Fraunces","Iowan Old Style","Palatino Linotype",Palatino,"Noto Serif",Georgia,serif;
  --radius:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1f1a16; --surface:#2a231e; --surface-2:#342b24; --text:#f1e6d6; --muted:#b4a28c; --border:#45392f;
    --accent:#e08a5f; --accent-press:#a85a35; --accent-ink:#1f1a16; --accent-soft:#4a3125;
    --ok:#9cc28f; --ok-soft:#2c3826; --bad:#e8846f; --bad-soft:#45261f; --warn:#e8c06a; --warn-soft:#3f3218;
    --ink:#f1e6d6; --dots:rgba(255,240,220,.04); --lift:0 3px 0 rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#1f1a16; --surface:#2a231e; --surface-2:#342b24; --text:#f1e6d6; --muted:#b4a28c; --border:#45392f;
  --accent:#e08a5f; --accent-press:#a85a35; --accent-ink:#1f1a16; --accent-soft:#4a3125;
  --ok:#9cc28f; --ok-soft:#2c3826; --bad:#e8846f; --bad-soft:#45261f; --warn:#e8c06a; --warn-soft:#3f3218;
  --ink:#f1e6d6; --dots:rgba(255,240,220,.04); --lift:0 3px 0 rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  background:var(--bg) radial-gradient(var(--dots) 1px,transparent 1.2px) 0 0/14px 14px;
  color:var(--text);
  font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%; min-height:100vh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px calc(110px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:var(--serif);letter-spacing:-.01em}
h1{font-size:1.75rem;margin:6px 0 4px;font-weight:650}
.page-head{margin-bottom:16px}
.sub{color:var(--muted);margin:0}
.muted{color:var(--muted)} .small{font-size:.88rem} .ink{color:var(--text)}
.card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);box-shadow:var(--lift);padding:18px}
.note-card{margin-bottom:14px;border-style:dashed;border-color:var(--accent)}
.stack>*+*{margin-top:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.label{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px}
.link{background:none;border:none;color:var(--accent);font-weight:650;padding:6px 4px;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1.5px}
.link.danger{color:var(--bad)}
.hidden{display:none!important}

/* botones con relieve */
.btn{border:1.5px solid var(--border);background:var(--surface);border-radius:14px;padding:11px 18px;min-height:50px;font-weight:650;box-shadow:0 3px 0 var(--border);transition:transform .06s,box-shadow .06s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--border)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent-press);box-shadow:0 3px 0 var(--accent-press)}
.btn.primary:active{box-shadow:0 1px 0 var(--accent-press)}
.btn.ghost{background:transparent;box-shadow:none}
.btn.block{width:100%} .btn.big{min-height:58px;font-size:1.05rem}
.btn.sm{min-height:38px;padding:6px 12px;font-size:.9rem;border-radius:11px}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.icon-btn{border:1.5px solid var(--border);background:var(--surface);border-radius:14px;width:46px;height:46px;display:inline-grid;place-items:center;box-shadow:0 3px 0 var(--border);flex:none}
.icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--border)}
.icon-btn svg,#tabs svg,.chk svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* temas y chips */
.topic{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:13px 15px;min-height:64px}
.topic+.topic{margin-top:9px}
.topic .chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--border);display:grid;place-items:center;flex:none;color:transparent}
.topic .chk svg{width:16px;height:16px;stroke-width:2.6}
.topic[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.topic[aria-pressed="true"] .chk{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.topic .t-name{font-weight:700} .topic .t-desc{color:var(--muted);font-size:.9rem}
.topic .count{margin-left:auto;color:var(--muted);font-size:.88rem;flex:none}
.topic:disabled{opacity:.5;cursor:default}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--border);background:var(--surface);border-radius:999px;padding:8px 16px;min-height:42px;font-weight:650}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.toggle{display:flex;align-items:center;gap:12px;cursor:pointer}
.switch{width:52px;height:32px;border-radius:999px;background:var(--border);position:relative;flex:none;border:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fffaf1;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .15s}
.switch[aria-checked="true"]{background:var(--accent)} .switch[aria-checked="true"]::after{left:23px}
.footer-note{color:var(--muted);font-size:.85rem;margin-top:20px;text-align:center}

/* preguntas */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.progress{height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin-bottom:18px;border:1.5px solid var(--border)}
.progress>div{height:100%;background:var(--accent);border-radius:999px;transition:width .25s}
.tag{display:inline-block;font-size:.76rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);vertical-align:middle}
.tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.bad{background:var(--bad-soft);color:var(--bad)} .tag.okt{background:var(--ok-soft);color:var(--ok)}
.qtext{font-family:var(--serif);font-size:1.3rem;font-weight:600;line-height:1.35;margin:10px 0 16px}
.qtext.sm{font-size:1.05rem;margin:8px 0 10px}
.opt{display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:13px 15px;min-height:58px;line-height:1.4;box-shadow:0 2px 0 var(--border)}
.opt+.opt{margin-top:10px}
.opt .letter{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--surface-2);font-size:.9rem;font-family:var(--serif)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 2px 0 var(--accent)}
.opt[aria-pressed="true"] .letter{background:var(--accent);color:var(--accent-ink)}
.opt.correct{border-color:var(--ok);background:var(--ok-soft);box-shadow:0 2px 0 var(--ok)} .opt.correct .letter{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 2px 0 var(--bad)} .opt.wrong .letter{background:var(--bad);color:#fff}
.opt.dim{opacity:.5} .opt:disabled{cursor:default;color:inherit}
.navbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1.5px solid var(--border);padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:20}
.navbar .inner{max-width:760px;margin:0 auto;display:flex;gap:10px} .navbar .btn{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px;margin-top:12px}
.grid button{height:44px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface);font-weight:650}
.grid button.answered{background:var(--accent-soft);border-color:var(--accent)}
.grid button.current{outline:3px solid var(--accent);outline-offset:1px}

/* resultados */
.score{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.ring{--p:0;width:124px;height:124px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--ring-color,var(--ok)) calc(var(--p)*1%),var(--surface-2) 0)}
.ring>div{width:98px;height:98px;border-radius:50%;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring b{font-family:var(--serif);font-size:2rem;line-height:1} .ring span{font-size:.78rem;color:var(--muted)}
.verdict{font-family:var(--serif);font-weight:650;font-size:1.15rem}
.stats,.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.stat{border-radius:14px;padding:12px 8px;text-align:center;background:var(--surface-2);font-size:.88rem;color:var(--muted)}
.stat b{display:block;font-family:var(--serif);font-size:1.7rem;color:var(--text);line-height:1.2}
.stat.ok b{color:var(--ok)} .stat.bad b{color:var(--bad)} .stat.warnc b{color:var(--warn)}
.seg{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:14px;margin:18px 0 14px;overflow-x:auto;border:1.5px solid var(--border)}
.seg button{flex:1;border:none;background:transparent;border-radius:10px;padding:9px 10px;min-height:42px;font-weight:650;white-space:nowrap;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--text);box-shadow:0 2px 0 var(--border)}
.rev{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:15px}
.rev+.rev{margin-top:12px}
.ans{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:11px;margin-top:8px;font-size:.97rem}
.ans .k{flex:none;font-weight:700;font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;padding-top:3px;width:84px}
.ans.ok{background:var(--ok-soft)} .ans.ok .k{color:var(--ok)}
.ans.bad{background:var(--bad-soft)} .ans.bad .k{color:var(--bad)}
.ans.blank{background:var(--surface-2)} .ans.blank .k{color:var(--muted)}
.info-btn{margin-top:12px;border:1.5px solid var(--accent);color:var(--accent);background:transparent;border-radius:11px;padding:8px 14px;min-height:42px;font-weight:700}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.empty-state{text-align:center}
.doodle{width:120px;height:90px;fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

/* repaso */
.section-title{font-size:1.15rem;margin:24px 0 10px}
.weak{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:9px}
.weak-n{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--bad-soft);color:var(--bad);font-family:var(--serif);font-weight:700;font-size:1.1rem}
.weak-q{flex:1;font-size:.95rem;line-height:1.35}
.weak-r{flex:none;color:var(--ok);font-weight:700;font-size:.85rem}

/* estudiar */
.topic-chips{margin-bottom:14px}
.paper{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:20px 18px;box-shadow:var(--lift);margin-bottom:14px}
.paper-title{font-size:1.25rem;margin:0 0 6px}
.paper section{border-top:1.5px dashed var(--border);margin-top:16px;padding-top:12px}
.paper h3{font-size:1.08rem;margin:0 0 8px;color:var(--accent)}
.paper ul{margin:0;padding-left:20px} .paper li{margin:5px 0}
.paper table{width:100%;border-collapse:collapse;font-size:.92rem;margin:4px 0 8px;display:block;overflow-x:auto}
.paper th,.paper td{border:1px solid var(--border);padding:7px 8px;text-align:left;vertical-align:top}
.paper th{background:var(--surface-2)}
.qa{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.qa summary{cursor:pointer;font-weight:600;line-height:1.4}
.qa-note{margin-top:10px;font-size:.95rem;line-height:1.55}
.lh{border-top:1.5px dashed var(--border);padding:12px 0}
.lh:first-of-type{border-top:none}
.lh-q{font-weight:650} .lh-a{color:var(--ok);font-weight:700;margin:6px 0} .lh-n{font-size:.94rem;line-height:1.55;color:var(--text)}

/* pestañas inferiores */
#tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1.5px solid var(--border);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:15}
.tabs-inner{max-width:560px;margin:0 auto;display:flex}
#tabs button{flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;color:var(--muted);font-size:.74rem;font-weight:650;position:relative;border-radius:12px}
#tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
#tabs .badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--bad);color:#fff;font-style:normal;font-size:.68rem;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
body.focus #tabs{display:none}

/* modal */
.backdrop{position:fixed;inset:0;background:rgba(40,28,20,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal{background:var(--surface);width:100%;max-width:680px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));border-top:2px solid var(--border)}
@media (min-width:700px){.backdrop{align-items:center;padding:24px}.modal{border-radius:22px;max-height:84vh;border:2px solid var(--border)}}
.modal h3{margin:0 0 8px;font-size:1.15rem}
.modal .note{font-size:1rem;line-height:1.62;margin-top:14px}
.callout{border-radius:12px;padding:10px 12px;font-size:.95rem;margin-top:12px}
.callout.warn{background:var(--warn-soft);color:var(--warn)} .callout.okc{background:var(--ok-soft)}
.field{width:100%;font:inherit;padding:12px 14px;border-radius:12px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);margin-top:6px}

/* ======== modo consulta ======== */
.g-head{display:flex;align-items:flex-end;gap:10px;margin-bottom:10px}
.g-head>div{flex:1;min-width:0}
.g-kicker{font-family:var(--serif);font-style:italic;color:var(--accent);margin:0;font-size:1rem}
.g-title{font-size:1.6rem;margin:0;line-height:1.15;overflow-wrap:anywhere}
.g-title.sm{font-size:1.3rem}
.icon-btn.soft{background:var(--surface-2)}
.g-stats{display:flex;gap:10px;margin-bottom:12px}
.g-pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1.5px solid var(--border);border-radius:999px;padding:6px 12px 6px 8px;font-family:var(--serif);font-size:1.05rem;box-shadow:0 2px 0 var(--border)}
.g-pill.sm{padding:4px 10px 4px 6px;font-size:.95rem}
.ico-coin,.ico-star{width:22px;height:22px;flex:none;vertical-align:middle}
.g-rep{flex:1;display:flex;gap:8px;align-items:center;background:var(--surface);border:1.5px solid var(--border);border-radius:16px;padding:6px 12px 8px 8px;box-shadow:0 2px 0 var(--border);min-width:0}
.g-rep>div{flex:1;min-width:0}
.g-rep-top{display:flex;gap:8px;align-items:baseline}
.g-rep-top b{font-family:var(--serif);font-size:1.05rem}
.g-rep-top span{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-bar{height:7px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:3px}
.g-bar>div{height:100%;background:linear-gradient(90deg,#e8a65a,#c8643b);border-radius:999px}
.scene-frame{border:2.5px solid #4a3426;border-radius:20px;overflow:hidden;box-shadow:0 4px 0 rgba(74,52,38,.18);background:#f3e6cf;line-height:0}
.scene{width:100%;height:auto;display:block}
.g-actions{display:grid;gap:10px;margin:16px 0}
.g-paper{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--lift)}
.g-paper p{margin:6px 0}
.g-hand{font-family:var(--serif);font-style:italic;color:var(--accent);font-size:1.05rem;margin:0 0 4px!important}
.dots{display:flex;gap:6px;justify-content:center;margin:-2px 0 12px}
.dots span{width:10px;height:10px;border-radius:50%;background:var(--border)}
.dots span.cur{background:var(--accent);transform:scale(1.25)} .dots span.ok{background:var(--ok)} .dots span.bad{background:var(--bad)}
.ficha{position:relative;margin:18px 6px 14px;background:#fffdf6;color:#3d2e22;border-radius:6px;padding:16px 18px 14px;transform:rotate(-.6deg);box-shadow:0 3px 0 rgba(74,52,38,.15),0 0 0 1.5px #e6d6b8;
  background-image:linear-gradient(#e9a49166 0 0),repeating-linear-gradient(#fffdf6 0 25px,#d9e4ea 25px 26px);background-size:100% 2px,100% 100%;background-repeat:no-repeat,repeat;background-position:0 40px,0 14px}
.ficha-clip{position:absolute;top:-12px;right:26px;width:16px;height:36px;border:3px solid #9aa4ab;border-radius:9px;border-bottom-color:transparent}
.ficha-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-height:26px}
.ficha-name{font-family:var(--serif);font-weight:700;font-size:1.35rem}
.ficha-sp{font-size:.82rem;color:#85705d;font-weight:650;text-transform:uppercase;letter-spacing:.05em}
.ficha-motivo{margin:12px 0 0;line-height:26px;font-size:1rem}
.g-question{margin-top:6px}
.g-result{margin:16px 0 0;border-radius:var(--radius);padding:16px;border:1.5px solid}
.g-result.ok{background:var(--ok-soft);border-color:var(--ok)} .g-result.bad{background:var(--bad-soft);border-color:var(--bad)}
.g-result-msg{margin-bottom:14px;line-height:1.5}
.g-gains{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
.g-gains span{display:inline-flex;align-items:center;gap:5px;font-family:var(--serif);font-weight:700;font-size:1.1rem;background:var(--surface);border-radius:999px;padding:3px 12px 3px 6px;border:1.5px solid var(--border)}
.g-gains.big span{font-size:1.35rem;padding:6px 16px 6px 8px}
.g-gains .streak{font-size:.9rem;padding:3px 12px;color:var(--accent)}
.summary{text-align:center}
.summary .g-gains{justify-content:center;margin:14px 0}
.sum-list{list-style:none;padding:0;margin:16px 0;text-align:left}
.sum-list li{display:flex;align-items:center;gap:10px;padding:6px 4px;border-top:1.5px dashed var(--border);font-weight:650}
.mini-pet{width:46px;height:46px;flex:none}
.shop-cats{display:flex;gap:6px;overflow-x:auto;margin:14px -16px 12px;padding:2px 16px 6px;scrollbar-width:none}
.shop-cats::-webkit-scrollbar{display:none}
.shop-cats button{flex:none;border:1.5px solid var(--border);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:650;font-size:.92rem}
.shop-cats button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent-press);color:var(--accent-ink)}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.item{background:var(--surface);border:1.5px solid var(--border);border-radius:16px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;box-shadow:0 2px 0 var(--border);cursor:pointer}
.item.on{border-color:var(--accent);background:var(--accent-soft)}
.thumb{width:100%;height:96px;display:grid;place-items:center;background:var(--surface-2);border-radius:12px;overflow:hidden}
.thumb svg{height:96px;width:auto}
.thumb.room svg{width:100%;height:auto}
.swatch{width:100%;height:96px;border-radius:12px;border:2px solid #4a3426}
.item-name{font-weight:650;font-size:.92rem;line-height:1.25;min-height:2.4em;display:flex;align-items:center}
.item .btn{width:100%}
.btn.buy .ico-coin{width:18px;height:18px}
.worn{font-size:.85rem;font-weight:700;color:var(--accent);min-height:38px;display:grid;place-items:center}

/* energía, conversación y avisos */
.g-stats{display:grid;grid-template-columns:auto 1fr;gap:10px}
.g-meter{display:flex;gap:8px;align-items:center;background:var(--surface);border:1.5px solid var(--border);border-radius:16px;padding:6px 12px 8px 8px;box-shadow:0 2px 0 var(--border);min-width:0}
.g-meter>div{flex:1;min-width:0}
.g-meter.wide{grid-column:1 / -1}
.g-bar.en>div{background:linear-gradient(90deg,#f3d36b,#e8a65a)}
.ico-bolt{width:22px;height:22px;flex:none;vertical-align:middle}
.btn .cost{display:inline-flex;align-items:center;gap:2px;background:rgba(255,250,241,.22);border-radius:999px;padding:1px 10px 1px 4px;margin-left:6px;font-family:var(--serif)}
.btn .cost .ico-bolt{width:18px;height:18px}
.center{text-align:center;margin:0}
.tired{border-style:dashed;border-color:#e8a65a}
.ficha-owner{margin:2px 0 0;font-size:.88rem;color:#85705d;font-style:italic;font-family:var(--serif)}
.chat{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.bub{display:flex;gap:10px;align-items:flex-end;max-width:92%}
.bub .face{width:44px;height:44px;flex:none;border-radius:50%;background:var(--surface-2);border:1.5px solid var(--border)}
.bub p{margin:0;padding:11px 14px;border-radius:18px;line-height:1.45;border:1.5px solid var(--border);background:var(--surface);box-shadow:0 2px 0 var(--border)}
.bub.them p{border-bottom-left-radius:6px}
.bub.me{flex-direction:row-reverse;align-self:flex-end}
.bub.me p{border-bottom-right-radius:6px;background:var(--accent-soft);border-color:var(--accent);box-shadow:0 2px 0 var(--accent)}
.bub.me.ok p{background:var(--ok-soft);border-color:var(--ok);box-shadow:0 2px 0 var(--ok)}
.bub.me.bad p{background:var(--bad-soft);border-color:var(--bad);box-shadow:0 2px 0 var(--bad)}
.bub.bye p{font-family:var(--serif);font-style:italic}
.fb{border-radius:14px;padding:12px 14px;border:1.5px dashed;font-size:.95rem;line-height:1.5;margin:0 4px}
.fb.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok-soft) 60%,transparent)}
.fb.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad-soft) 60%,transparent)}
.fb-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fb.ok .fb-h b{color:var(--ok)} .fb.bad .fb-h b{color:var(--bad)}
.fb-gain{margin-left:auto;display:inline-flex;align-items:center;gap:3px;font-family:var(--serif);font-weight:700}
.fb-gain .ico-coin,.fb-gain .ico-star{width:18px;height:18px}
.fb-correct{margin:8px 0 0} .fb-why{margin:8px 0 0;color:var(--text)}
.fb .link{padding:6px 0 0;font-size:.9rem}
.reply-head{margin:18px 0 8px!important}
.opt.reply{font-size:.97rem}
.energy-chip{display:inline-flex;align-items:center;gap:4px;font-size:.85rem;font-weight:650;background:var(--surface);border:1.5px solid var(--border);border-radius:999px;padding:4px 12px 4px 6px;color:var(--muted)}
.energy-chip.paused{opacity:.55}
.energy-chip .ico-bolt{width:18px;height:18px}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-140%);background:var(--surface);border:1.5px solid var(--border);box-shadow:0 4px 0 rgba(74,52,38,.15);border-radius:999px;padding:8px 16px 8px 10px;display:flex;align-items:center;gap:6px;z-index:60;transition:transform .35s cubic-bezier(.2,.9,.3,1.3);font-weight:600;white-space:nowrap}
#toast.show{transform:translate(-50%,0)}
@media (max-width:380px){.g-rep-top span{display:none}}
@media print{
  #tabs,.seg,.chips,.btn,.link,.navbar,.icon-btn{display:none!important}
  body{background:#fff;color:#000} .paper,.qa,.card{box-shadow:none;border-color:#bbb;break-inside:avoid-page}
  .wrap{padding:0}
}
</style>
</head>

<main class="wrap" id="app"></main>
<nav id="tabs" aria-label="Secciones"></nav>
<div id="modal-root"></div>
<script src="data.js"></script>
<script src="study.js"></script>
<script src="app.js"></script>
<script src="consultas.js"></script>
<script src="game.js"></script>
</body>
