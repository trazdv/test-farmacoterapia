<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Test Farmacoterapia</title>
<meta name="description" content="Test de estudio del 1er parcial de Farmacoterapia veterinaria, por temas, con repaso, apuntes y modo consulta.">
<meta name="theme-color" content="#fff1e2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Farmaco Test">
<script>/* tema: claro por defecto aunque el móvil esté en modo oscuro */
try { var t = JSON.parse(localStorage.getItem("ft_theme")) || "light"; if (t !== "auto") document.documentElement.dataset.theme = t; }
catch (e) { document.documentElement.dataset.theme = "light"; }</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#fff1e2; --bg2:#ffe3cc; --surface:#ffffff; --surface-2:#fff4ea; --text:#3b2a35; --muted:#8a7280; --border:#f3d9c6;
  --accent:#ff6f4f; --accent-press:#d94e33; --accent-ink:#ffffff; --accent-soft:#ffe1d6;
  --teal:#2ec4b0; --teal-press:#1c9c8b; --sun:#ffc23d; --sun-press:#e09a10; --sky:#5fb8ef; --lilac:#a98bf0; --pink:#ff7fae;
  --ok:#25b07a; --ok-soft:#dcf6ea; --bad:#f0544f; --bad-soft:#ffe1df; --warn:#c98500; --warn-soft:#fff1cc;
  --ink:#4a3426; --lift:0 4px 0 rgba(219,120,80,.18); --round:"SF Pro Rounded",ui-rounded,"Arial Rounded MT Bold","Nunito","Varela Round",system-ui,sans-serif;
  --radius:22px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#231d33; --bg2:#2d2542; --surface:#322a48; --surface-2:#3b3254; --text:#f6ecff; --muted:#bba9cf; --border:#4a3f66;
    --accent:#ff8466; --accent-press:#c95a40; --accent-ink:#231d33; --accent-soft:#4f3346;
    --ok:#4fd69a; --ok-soft:#24453c; --bad:#ff7a73; --bad-soft:#4c2c35; --warn:#ffcf5c; --warn-soft:#4a3d24; --lift:0 4px 0 rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#231d33; --bg2:#2d2542; --surface:#322a48; --surface-2:#3b3254; --text:#f6ecff; --muted:#bba9cf; --border:#4a3f66;
  --accent:#ff8466; --accent-press:#c95a40; --accent-ink:#231d33; --accent-soft:#4f3346;
  --ok:#4fd69a; --ok-soft:#24453c; --bad:#ff7a73; --bad-soft:#4c2c35; --warn:#ffcf5c; --warn-soft:#4a3d24; --lift:0 4px 0 rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  background:
    radial-gradient(circle at 12% 8%, rgba(255,194,61,.28) 0 90px, transparent 91px),
    radial-gradient(circle at 92% 22%, rgba(46,196,176,.20) 0 120px, transparent 121px),
    radial-gradient(circle at 80% 88%, rgba(169,139,240,.20) 0 110px, transparent 111px),
    radial-gradient(circle at 6% 70%, rgba(255,127,174,.18) 0 80px, transparent 81px),
    linear-gradient(180deg,var(--bg),var(--bg2));
  background-attachment:fixed;
  color:var(--text);
  font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%; min-height:100vh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px calc(116px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:var(--round);letter-spacing:-.01em}
h1{font-size:1.9rem;margin:6px 0 4px;font-weight:900}
.page-head{margin-bottom:16px}
.page-head h1{background:linear-gradient(90deg,var(--accent),var(--pink) 55%,var(--lilac));-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block}
.sub{color:var(--muted);margin:0}
.muted{color:var(--muted)} .small{font-size:.88rem} .ink{color:var(--text)} .center{text-align:center;margin:0}
.card{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);box-shadow:var(--lift);padding:18px}
.note-card{margin-bottom:14px;border:2px dashed var(--accent);background:var(--accent-soft)}
.stack>*+*{margin-top:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.label{font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px}
.link{background:none;border:none;color:var(--accent);font-weight:800;padding:6px 4px;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:2px}
.link.danger{color:var(--bad)}
.hidden{display:none!important}

/* ===== animaciones generales ===== */
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@keyframes popIn{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes shimmer{from{background-position:-200px 0}to{background-position:200px 0}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes fall{0%{transform:translate3d(0,-20px,0) rotate(0);opacity:1}100%{transform:translate3d(var(--dx),105vh,0) rotate(var(--rot));opacity:.9}}
@keyframes coin{0%{transform:translate(0,0) scale(.6);opacity:0}20%{opacity:1;transform:translate(0,-10px) scale(1.1)}100%{transform:translate(var(--dx),-80px) scale(.8);opacity:0}}
#app.enter>*{animation:rise .38s cubic-bezier(.2,.9,.3,1.2) both}
#app.enter>*:nth-child(2){animation-delay:.05s}#app.enter>*:nth-child(3){animation-delay:.1s}#app.enter>*:nth-child(4){animation-delay:.15s}#app.enter>*:nth-child(5){animation-delay:.2s}#app.enter>*:nth-child(6){animation-delay:.25s}
#app.enter .g-wrap>*{animation:rise .38s cubic-bezier(.2,.9,.3,1.2) both}
#app.enter .g-wrap>*:nth-child(2){animation-delay:.05s}#app.enter .g-wrap>*:nth-child(3){animation-delay:.1s}#app.enter .g-wrap>*:nth-child(4){animation-delay:.15s}#app.enter .g-wrap>*:nth-child(5){animation-delay:.2s}#app.enter .g-wrap>*:nth-child(6){animation-delay:.25s}#app.enter .g-wrap>*:nth-child(7){animation-delay:.3s}
.confetti{position:fixed;top:0;width:10px;height:14px;border-radius:3px;z-index:80;pointer-events:none;animation:fall var(--t) cubic-bezier(.3,.6,.5,1) forwards}
.coinfx{position:fixed;z-index:81;pointer-events:none;width:26px;height:26px;animation:coin 1s ease-out forwards}

/* ===== botones de juego ===== */
.btn{border:2px solid var(--border);background:var(--surface);border-radius:16px;padding:11px 18px;min-height:52px;font-weight:800;font-family:var(--round);box-shadow:0 5px 0 var(--border);transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--border)}
.btn.primary{background:linear-gradient(180deg,#ff8a66,var(--accent));color:#fff;border-color:var(--accent-press);box-shadow:0 5px 0 var(--accent-press);text-shadow:0 1px 0 rgba(0,0,0,.12)}
.btn.primary:active{box-shadow:0 1px 0 var(--accent-press)}
.btn.ghost{background:transparent;box-shadow:none}
.btn.block{width:100%} .btn.big{min-height:62px;font-size:1.12rem}
.btn.sm{min-height:40px;padding:6px 12px;font-size:.9rem;border-radius:12px;box-shadow:0 3px 0 var(--border)}
.btn.sm.primary{box-shadow:0 3px 0 var(--accent-press)}
.btn.buy{background:linear-gradient(180deg,#ffd76a,var(--sun));border-color:var(--sun-press);box-shadow:0 3px 0 var(--sun-press);color:#5a3a00}
.btn:disabled{opacity:.45;cursor:default;transform:none;filter:grayscale(.4)}
.icon-btn{border:2px solid var(--border);background:var(--surface);border-radius:16px;width:48px;height:48px;display:inline-grid;place-items:center;box-shadow:0 4px 0 var(--border);flex:none;transition:transform .08s}
.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--border)}
.icon-btn svg,#tabs svg,.chk svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}

/* temas y chips */
.topic{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:2px solid var(--border);border-radius:18px;padding:13px 15px;min-height:66px;transition:transform .15s,background .2s;box-shadow:0 3px 0 var(--border)}
.topic+.topic{margin-top:10px}
.topic:active{transform:scale(.98)}
.topic .chk{width:28px;height:28px;border-radius:9px;border:2.5px solid var(--border);display:grid;place-items:center;flex:none;color:transparent;transition:all .2s}
.topic .chk svg{width:16px;height:16px;stroke-width:3}
.topic[aria-pressed="true"]{border-color:var(--teal);background:color-mix(in srgb,var(--teal) 12%,var(--surface));box-shadow:0 3px 0 var(--teal-press)}
.topic[aria-pressed="true"] .chk{background:var(--teal);border-color:var(--teal);color:#fff;animation:popIn .3s}
.topic .t-name{font-weight:900;font-family:var(--round)} .topic .t-desc{color:var(--muted);font-size:.9rem}
.topic .count{margin-left:auto;color:var(--muted);font-size:.85rem;flex:none;font-weight:700}
.topic:disabled{opacity:.5;cursor:default}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--border);background:var(--surface);border-radius:999px;padding:8px 16px;min-height:42px;font-weight:800;font-family:var(--round);transition:transform .12s}
.chip:active{transform:scale(.94)}
.chip[aria-pressed="true"]{border-color:var(--lilac);background:var(--lilac);color:#fff;box-shadow:0 3px 0 #7d5fd0}
.tchip{display:inline-flex;align-items:center;gap:5px}
.tchip svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.tchip[aria-pressed="false"]{border-style:dashed;background:transparent;color:var(--muted);opacity:.6;text-decoration:line-through;text-decoration-thickness:2px}
.tchip[aria-pressed="false"] svg{display:none}
.tchip[aria-pressed="true"]{border-color:var(--teal);background:var(--teal);color:#fff;box-shadow:0 3px 0 var(--teal-press)}
.tchip.nope{animation:shake .4s}
.toggle{display:flex;align-items:center;gap:12px;cursor:pointer;font-weight:700}
.switch{width:54px;height:32px;border-radius:999px;background:var(--border);position:relative;flex:none;border:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 3px rgba(0,0,0,.2);transition:left .25s cubic-bezier(.3,1.6,.5,1)}
.switch[aria-checked="true"]{background:var(--teal)} .switch[aria-checked="true"]::after{left:25px}
.footer-note{color:var(--muted);font-size:.85rem;margin-top:20px;text-align:center}

/* preguntas */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.progress{height:14px;background:var(--surface);border-radius:999px;overflow:hidden;margin-bottom:18px;border:2px solid var(--border)}
.progress>div{height:100%;background:linear-gradient(90deg,var(--teal),var(--sky),var(--lilac));background-size:200px 100%;border-radius:999px;transition:width .4s cubic-bezier(.3,1.4,.5,1);animation:shimmer 2.5s linear infinite}
.tag{display:inline-block;font-size:.76rem;font-weight:800;padding:4px 11px;border-radius:999px;background:color-mix(in srgb,var(--sky) 18%,var(--surface));color:#2b78ad;vertical-align:middle}
.tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.bad{background:var(--bad-soft);color:var(--bad)} .tag.okt{background:var(--ok-soft);color:var(--ok)}
.qtext{font-family:var(--round);font-size:1.32rem;font-weight:800;line-height:1.35;margin:12px 0 16px}
.qtext.sm{font-size:1.05rem;margin:8px 0 10px}
.opt{display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:2px solid var(--border);border-radius:18px;padding:13px 15px;min-height:60px;line-height:1.4;box-shadow:0 4px 0 var(--border);transition:transform .1s,background .2s,border-color .2s;animation:rise .35s both}
.opt:nth-child(2){animation-delay:.05s}.opt:nth-child(3){animation-delay:.1s}.opt:nth-child(4){animation-delay:.15s}
.opt+.opt{margin-top:11px}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--border)}
.opt .letter{flex:none;width:32px;height:32px;border-radius:11px;display:grid;place-items:center;font-weight:900;font-family:var(--round);background:var(--surface-2);font-size:.95rem;border:2px solid var(--border)}
.opt[aria-pressed="true"]{border-color:var(--sky);background:color-mix(in srgb,var(--sky) 14%,var(--surface));box-shadow:0 4px 0 #3c93c9}
.opt[aria-pressed="true"] .letter{background:var(--sky);border-color:var(--sky);color:#fff;animation:popIn .3s}
.opt.correct{border-color:var(--ok);background:var(--ok-soft);box-shadow:0 4px 0 #1a8a5e;animation:popIn .4s} .opt.correct .letter{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 4px 0 #c43a36;animation:shake .4s} .opt.wrong .letter{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.dim{opacity:.45} .opt:disabled{cursor:default;color:inherit}
.navbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:2px solid var(--border);padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:20;box-shadow:0 -6px 20px rgba(219,120,80,.12)}
.navbar .inner{max-width:760px;margin:0 auto;display:flex;gap:10px} .navbar .btn{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px;margin-top:12px}
.grid button{height:44px;border-radius:12px;border:2px solid var(--border);background:var(--surface);font-weight:800}
.grid button.answered{background:color-mix(in srgb,var(--sky) 20%,var(--surface));border-color:var(--sky)}
.grid button.current{outline:3px solid var(--accent);outline-offset:1px}

/* resultados */
@property --p{syntax:"<number>";inherits:false;initial-value:0}
@keyframes ringfill{from{--p:0}}
.score{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.ring{--p:0;width:130px;height:130px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--ring-color,var(--ok)) calc(var(--p)*1%),var(--surface-2) 0);animation:ringfill 1.2s cubic-bezier(.3,.9,.4,1) both,popIn .5s}
.ring>div{width:102px;height:102px;border-radius:50%;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring b{font-family:var(--round);font-size:2.1rem;line-height:1;font-weight:900} .ring span{font-size:.78rem;color:var(--muted)}
.verdict{font-family:var(--round);font-weight:900;font-size:1.25rem}
.stats,.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.stat{border-radius:16px;padding:12px 8px;text-align:center;background:var(--surface-2);font-size:.88rem;color:var(--muted);border:2px solid var(--border);animation:popIn .4s both}
.stat:nth-child(2){animation-delay:.1s}.stat:nth-child(3){animation-delay:.2s}
.stat b{display:block;font-family:var(--round);font-size:1.8rem;color:var(--text);line-height:1.2;font-weight:900}
.stat.ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 35%,transparent)} .stat.ok b{color:var(--ok)}
.stat.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 35%,transparent)} .stat.bad b{color:var(--bad)}
.stat.warnc{background:var(--warn-soft)} .stat.warnc b{color:var(--warn)}
.seg{display:flex;gap:4px;background:var(--surface);padding:5px;border-radius:18px;margin:18px 0 14px;overflow-x:auto;border:2px solid var(--border)}
.seg button{flex:1 1 auto;border:none;background:transparent;border-radius:13px;padding:9px 8px;min-height:44px;font-weight:800;font-family:var(--round);white-space:nowrap;color:var(--muted);transition:all .2s}
.seg button[aria-selected="true"]{background:linear-gradient(180deg,#ff8a66,var(--accent));color:#fff;box-shadow:0 3px 0 var(--accent-press)}
.rev{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:15px;animation:rise .35s both}
.rev+.rev{margin-top:12px}
.ans{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:14px;margin-top:8px;font-size:.97rem}
.ans .k{flex:none;font-weight:900;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;padding-top:3px;width:84px}
.ans.ok{background:var(--ok-soft)} .ans.ok .k{color:var(--ok)}
.ans.bad{background:var(--bad-soft)} .ans.bad .k{color:var(--bad)}
.ans.blank{background:var(--surface-2)} .ans.blank .k{color:var(--muted)}
.info-btn{margin-top:12px;border:2px solid var(--teal);color:var(--teal-press);background:color-mix(in srgb,var(--teal) 10%,var(--surface));border-radius:14px;padding:8px 14px;min-height:42px;font-weight:800;font-family:var(--round)}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.empty-state{text-align:center}
.doodle{width:120px;height:90px;fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;animation:floaty 3s ease-in-out infinite}

/* repaso */
.section-title{font-size:1.2rem;margin:24px 0 10px;font-weight:900}
.weak{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:2px solid var(--border);border-radius:18px;padding:12px 14px;margin-bottom:9px;box-shadow:0 3px 0 var(--border);animation:rise .35s both}
.weak-n{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--bad-soft);color:var(--bad);font-family:var(--round);font-weight:900;font-size:1.1rem;border:2px solid color-mix(in srgb,var(--bad) 40%,transparent)}
.weak-q{flex:1;font-size:.95rem;line-height:1.35}
.weak-r{flex:none;color:var(--ok);font-weight:800;font-size:.85rem}

/* estudiar */
.topic-chips{margin-bottom:14px}
.paper{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:20px 18px;box-shadow:var(--lift);margin-bottom:14px}
.paper-title{font-size:1.25rem;margin:0 0 6px;font-weight:900}
.paper section{border-top:2px dashed var(--border);margin-top:16px;padding-top:12px}
.paper h3{font-size:1.08rem;margin:0 0 8px;color:var(--accent);font-weight:900}
.paper ul{margin:0;padding-left:20px} .paper li{margin:5px 0}
.paper table{width:100%;border-collapse:collapse;font-size:.92rem;margin:4px 0 8px;display:block;overflow-x:auto}
.paper th,.paper td{border:1px solid var(--border);padding:7px 8px;text-align:left;vertical-align:top}
.paper th{background:var(--surface-2)}
.qa{background:var(--surface);border:2px solid var(--border);border-radius:16px;padding:12px 14px;margin-bottom:8px}
.qa summary{cursor:pointer;font-weight:700;line-height:1.4}
.qa-note{margin-top:10px;font-size:.95rem;line-height:1.55}
.lh{border-top:2px dashed var(--border);padding:12px 0} .lh:first-of-type{border-top:none}
.lh-q{font-weight:700} .lh-a{color:var(--ok);font-weight:800;margin:6px 0} .lh-n{font-size:.94rem;line-height:1.55}

/* pestañas inferiores */
#tabs{position:fixed;left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom));background:var(--surface);border:2px solid var(--border);border-radius:26px;padding:6px;z-index:15;box-shadow:0 8px 24px rgba(219,120,80,.22);max-width:560px;margin:0 auto}
.tabs-inner{display:flex;gap:4px}
#tabs button{flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 2px;color:var(--muted);font-size:.74rem;font-weight:800;font-family:var(--round);position:relative;border-radius:20px;transition:all .25s cubic-bezier(.3,1.5,.5,1)}
#tabs button[data-view="test"]{--tc:var(--sky)} #tabs button[data-view="repaso"]{--tc:var(--lilac)} #tabs button[data-view="estudiar"]{--tc:var(--teal)} #tabs button[data-view="consulta"]{--tc:var(--accent)}
#tabs button[aria-current="page"]{color:#fff;background:var(--tc);transform:translateY(-6px);box-shadow:0 5px 0 rgba(0,0,0,.15)}
#tabs button[aria-current="page"] svg{animation:wiggle .5s}
#tabs .badge{position:absolute;top:0;left:calc(50% + 6px);background:var(--bad);color:#fff;font-style:normal;font-size:.68rem;min-width:19px;height:19px;border-radius:10px;display:grid;place-items:center;padding:0 4px;border:2px solid var(--surface);animation:pulse 1.6s ease-in-out infinite}
body.focus #tabs{display:none}

/* modal */
.backdrop{position:fixed;inset:0;background:rgba(40,20,40,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:rise .2s both}
.modal{background:var(--surface);width:100%;max-width:680px;max-height:88vh;overflow:auto;border-radius:26px 26px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));border-top:3px solid var(--border);animation:rise .35s cubic-bezier(.2,.9,.3,1.2) both}
@media (min-width:700px){.backdrop{align-items:center;padding:24px}.modal{border-radius:26px;max-height:84vh;border:3px solid var(--border)}}
.modal h3{margin:0 0 8px;font-size:1.18rem;font-weight:900}
.modal .note{font-size:1rem;line-height:1.62;margin-top:14px}
.callout{border-radius:14px;padding:10px 12px;font-size:.95rem;margin-top:12px}
.callout.warn{background:var(--warn-soft);color:var(--warn)} .callout.okc{background:var(--ok-soft)}
.field{width:100%;font:inherit;padding:12px 14px;border-radius:14px;border:2px solid var(--border);background:var(--bg);color:var(--text);margin-top:6px}
.field.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.72rem;height:84px;resize:vertical;word-break:break-all;line-height:1.35}
.theme-pick{display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:14px;font-size:.85rem;color:var(--muted);font-weight:700}
.theme-pick button{border:2px solid var(--border);background:var(--surface);border-radius:999px;padding:5px 12px;font-weight:800;font-size:.82rem;color:var(--muted)}
.theme-pick button[aria-pressed="true"]{background:var(--lilac);border-color:var(--lilac);color:#fff}
.xfer{background:var(--surface-2);border:2px solid var(--border);border-radius:18px;padding:14px;margin-top:12px}
.xfer .label{margin-bottom:6px}
.xfer-sum{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin:0 0 12px;font-size:.92rem}
.xfer-sum .ico-coin{width:18px;height:18px}

/* ======== modo consulta ======== */
.g-head{display:flex;align-items:flex-end;gap:10px;margin-bottom:10px}
.g-head>div{flex:1;min-width:0}
.g-kicker{font-family:var(--round);font-weight:800;color:var(--accent);margin:0;font-size:.95rem;text-transform:uppercase;letter-spacing:.06em}
.g-title{font-size:1.7rem;margin:0;line-height:1.15;overflow-wrap:anywhere;font-weight:900}
.g-title.sm{font-size:1.35rem}
.icon-btn.soft{background:var(--surface-2)}
.g-stats{display:grid;grid-template-columns:auto 1fr;gap:10px;margin-bottom:12px}
.g-pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--border);border-radius:999px;padding:6px 14px 6px 8px;font-family:var(--round);font-weight:900;font-size:1.05rem;box-shadow:0 3px 0 var(--border)}
.g-pill.sm{padding:4px 10px 4px 6px;font-size:.95rem}
.g-pill .ico-coin{animation:wiggle 3s ease-in-out infinite}
.ico-coin,.ico-star,.ico-bolt{width:24px;height:24px;flex:none;vertical-align:middle}
.g-meter{display:flex;gap:8px;align-items:center;background:var(--surface);border:2px solid var(--border);border-radius:18px;padding:6px 12px 8px 8px;box-shadow:0 3px 0 var(--border);min-width:0}
.g-meter>div{flex:1;min-width:0}
.g-meter.wide{grid-column:1 / -1}
.g-rep-top{display:flex;gap:8px;align-items:baseline}
.g-rep-top b{font-family:var(--round);font-size:1.05rem;font-weight:900}
.g-rep-top span{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.g-bar{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:3px;border:1.5px solid var(--border)}
.g-bar>div{height:100%;background:linear-gradient(90deg,var(--sun),var(--accent));border-radius:999px;animation:growx 1s cubic-bezier(.3,1.3,.5,1) both;transform-origin:left}
.g-bar.en>div{background:linear-gradient(90deg,#ffe27a,var(--sun))}
@keyframes growx{from{transform:scaleX(0)}}
.scene-frame{border:3px solid #4a3426;border-radius:24px;overflow:hidden;box-shadow:0 6px 0 rgba(74,52,38,.22);background:#f3e6cf;line-height:0;position:relative;isolation:isolate}
/* acabado de ilustración: luz cálida de la ventana y grano de papel encima de la escena */
.scene-frame::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;background:radial-gradient(120% 90% at 12% 10%,rgba(255,226,170,.5),rgba(255,226,170,0) 55%),linear-gradient(180deg,rgba(255,255,255,0) 60%,rgba(120,70,40,.18));mix-blend-mode:soft-light}
.scene-frame::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;background:url(grain.png) 0 0/160px 160px;mix-blend-mode:multiply;opacity:.9}
.scene-frame.pop{animation:popIn .35s}
.scene{width:100%;height:auto;display:block}
.g-actions{display:grid;gap:12px;margin:16px 0}
.g-paper{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--lift)}
.g-paper p{margin:6px 0}
.g-hand{font-family:var(--round);font-weight:900;color:var(--accent);font-size:1.05rem;margin:0 0 4px!important}
.tired{border:2px dashed var(--sun);background:color-mix(in srgb,var(--sun) 10%,var(--surface))}
.btn .cost{display:inline-flex;align-items:center;gap:2px;background:rgba(255,255,255,.25);border-radius:999px;padding:1px 10px 1px 4px;margin-left:6px;font-family:var(--round)}
.btn .cost .ico-bolt{width:18px;height:18px}
#open.primary{animation:bounce 2.2s ease-in-out infinite}
.dots{display:flex;gap:7px;justify-content:center;margin:-2px 0 12px}
.dots span{width:12px;height:12px;border-radius:50%;background:var(--border);transition:all .3s}
.dots span.cur{background:var(--accent);transform:scale(1.3);animation:pulse 1.4s infinite} .dots span.ok{background:var(--ok)} .dots span.bad{background:var(--bad)}
.ficha{position:relative;margin:18px 6px 14px;background:#fffdf6;color:#3d2e22;border-radius:8px;padding:16px 18px 14px;transform:rotate(-.6deg);box-shadow:0 4px 0 rgba(74,52,38,.15),0 0 0 2px #f1dcc0;
  background-image:linear-gradient(#ff9d8a66 0 0),repeating-linear-gradient(#fffdf6 0 25px,#d9e4ea 25px 26px);background-size:100% 2px,100% 100%;background-repeat:no-repeat,repeat;background-position:0 40px,0 14px}
.ficha-clip{position:absolute;top:-12px;right:26px;width:16px;height:36px;border:3px solid #9aa4ab;border-radius:9px;border-bottom-color:transparent}
.ficha-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-height:26px}
.ficha-name{font-family:var(--round);font-weight:900;font-size:1.4rem}
.ficha-sp{font-size:.8rem;color:#85705d;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.ficha-owner{margin:2px 0 0;font-size:.88rem;color:#85705d;font-style:italic}
.ficha-motivo{margin:12px 0 0;line-height:26px;font-size:1rem}
.chat{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.bub{display:flex;gap:10px;align-items:flex-end;max-width:92%;animation:rise .35s cubic-bezier(.2,.9,.3,1.2) both}
.bub .face{width:46px;height:46px;flex:none;border-radius:50%;background:var(--surface-2);border:2px solid var(--border)}
.bub p{margin:0;padding:11px 14px;border-radius:20px;line-height:1.45;border:2px solid var(--border);background:var(--surface);box-shadow:0 3px 0 var(--border)}
.bub.them p{border-bottom-left-radius:6px}
.bub.me{flex-direction:row-reverse;align-self:flex-end}
.bub.me p{border-bottom-right-radius:6px;background:color-mix(in srgb,var(--sky) 14%,var(--surface));border-color:var(--sky);box-shadow:0 3px 0 #3c93c9}
.bub.me.ok p{background:var(--ok-soft);border-color:var(--ok);box-shadow:0 3px 0 #1a8a5e}
.bub.me.bad p{background:var(--bad-soft);border-color:var(--bad);box-shadow:0 3px 0 #c43a36}
.bub.bye p{font-style:italic;font-weight:600}
.fb{border-radius:18px;padding:12px 14px;border:2px dashed;font-size:.95rem;line-height:1.5;margin:0 4px;animation:popIn .4s both}
.fb.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok-soft) 70%,transparent)}
.fb.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad-soft) 70%,transparent)}
.fb-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fb.ok .fb-h b{color:var(--ok)} .fb.bad .fb-h b{color:var(--bad)}
.fb-h b{font-family:var(--round);font-weight:900;font-size:1.05rem}
.fb-gain{margin-left:auto;display:inline-flex;align-items:center;gap:3px;font-family:var(--round);font-weight:900}
.fb-gain .ico-coin,.fb-gain .ico-star{width:18px;height:18px}
.fb-correct{margin:8px 0 0} .fb-why{margin:8px 0 0}
.fb .link{padding:6px 0 0;font-size:.9rem}
.reply-head{margin:18px 0 8px!important}
.opt.reply{font-size:.97rem}
.g-result{margin:16px 0 0;border-radius:var(--radius);padding:16px;border:2px solid;animation:popIn .45s both}
.g-result.ok{background:var(--ok-soft);border-color:var(--ok)} .g-result.bad{background:var(--bad-soft);border-color:var(--bad)}
.g-result-msg{margin-bottom:14px;line-height:1.5}
.g-gains{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
.g-gains span{display:inline-flex;align-items:center;gap:5px;font-family:var(--round);font-weight:900;font-size:1.1rem;background:var(--surface);border-radius:999px;padding:3px 12px 3px 6px;border:2px solid var(--border);animation:popIn .45s both}
.g-gains span:nth-child(2){animation-delay:.12s}
.g-gains.big span{font-size:1.4rem;padding:6px 16px 6px 8px}
.g-gains .streak{font-size:.9rem;padding:3px 12px;color:var(--accent)}
.summary{text-align:center}
.summary .g-gains{justify-content:center;margin:14px 0}
.sum-list{list-style:none;padding:0;margin:16px 0;text-align:left}
.sum-list li{display:flex;align-items:center;gap:10px;padding:6px 4px;border-top:2px dashed var(--border);font-weight:700;animation:rise .35s both}
.mini-pet{width:48px;height:48px;flex:none}
.shop-cats{display:flex;gap:7px;overflow-x:auto;margin:14px -16px 12px;padding:4px 16px 8px;scrollbar-width:none}
.shop-cats::-webkit-scrollbar{display:none}
.shop-cats button{flex:none;border:2px solid var(--border);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:800;font-family:var(--round);font-size:.92rem;box-shadow:0 3px 0 var(--border);transition:transform .15s}
.shop-cats button[aria-pressed="true"]{background:var(--lilac);border-color:#7d5fd0;color:#fff;box-shadow:0 3px 0 #7d5fd0;transform:translateY(-2px)}
.set-bar{display:flex;gap:10px;margin-bottom:6px}.set-bar .btn{flex:1}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.shop-grid .thumb{content-visibility:auto;contain-intrinsic-size:auto 100px}   /* las miniaturas fuera de pantalla no se pintan hasta que llegas a ellas */
.item{background:var(--surface);border:2px solid var(--border);border-radius:20px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;box-shadow:0 4px 0 var(--border);cursor:pointer;animation:popIn .35s both;transition:transform .15s}
.item:active{transform:scale(.97)}
.item.on{border-color:var(--teal);background:color-mix(in srgb,var(--teal) 10%,var(--surface));box-shadow:0 4px 0 var(--teal-press)}
.item.trying{outline:3px dashed var(--accent);outline-offset:2px}
.thumb{width:100%;height:100px;display:grid;place-items:center;background:var(--surface-2);border-radius:14px;overflow:hidden}
.thumb svg{height:100px;width:auto}
.thumb.room svg{width:100%;height:100%}
.swatch{width:100%;height:100px;border-radius:14px;border:2.5px solid #4a3426}
.item-cat{font-size:.7rem;font-weight:900;text-transform:uppercase;letter-spacing:.05em;color:var(--lilac)}
.item-name{font-weight:800;font-size:.92rem;line-height:1.25;min-height:2.4em;display:flex;align-items:center}
.item .btn{width:100%}
.btn.buy .ico-coin{width:18px;height:18px}
.worn{font-size:.85rem;font-weight:900;color:var(--teal-press);min-height:40px;display:grid;place-items:center;font-family:var(--round)}
.scene-frame.dressing{background:radial-gradient(circle at 50% 38%,#fff6e4 0,#ffe7cf 55%,#ffd2b8 100%)}
.dress{height:300px;display:flex;align-items:flex-end;justify-content:center;position:relative;background:repeating-linear-gradient(90deg,transparent 0 26px,rgba(255,111,79,.07) 26px 28px)}
.dress::after{content:"";position:absolute;bottom:8px;left:50%;width:130px;height:18px;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(74,52,38,.3),rgba(74,52,38,0));border-radius:50%}
.dress-av{position:relative;z-index:1;width:180px;height:290px}
.dress-av svg{width:100%;height:100%}
.energy-chip{display:inline-flex;align-items:center;gap:4px;font-size:.85rem;font-weight:800;background:var(--surface);border:2px solid var(--sun);border-radius:999px;padding:4px 12px 4px 6px;color:var(--warn);font-family:var(--round)}
.energy-chip .ico-bolt{width:18px;height:18px;animation:wiggle 2s infinite}
.energy-chip.paused{opacity:.55} .energy-chip.paused .ico-bolt{animation:none}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-160%);background:var(--surface);border:2px solid var(--sun);box-shadow:0 6px 0 rgba(224,154,16,.35);border-radius:999px;padding:9px 18px 9px 10px;display:flex;align-items:center;gap:6px;z-index:60;transition:transform .45s cubic-bezier(.2,1.6,.4,1);font-weight:800;font-family:var(--round);white-space:nowrap}
#toast.show{transform:translate(-50%,0)}

/* ======== movimiento en la clínica ======== */
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:.9}}
@keyframes glow{0%,100%{opacity:.22}50%{opacity:.42}}
@keyframes flicker{0%,100%{transform:scale(1,1)}25%{transform:scale(.92,1.08)}50%{transform:scale(1.05,.95)}75%{transform:scale(.96,1.06)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes swim{0%,100%{transform:translateX(0)}50%{transform:translateX(-14px)}}
@keyframes swim2{0%,100%{transform:translateX(0)}50%{transform:translateX(16px)}}
@keyframes bubble{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-16px);opacity:0}}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,1.04)}}
@keyframes zz{0%{transform:translate(0,0);opacity:0}30%{opacity:1}100%{transform:translate(6px,-14px);opacity:0}}
@keyframes hop{0%,100%{transform:translateY(0)}30%{transform:translateY(-8px)}55%{transform:translateY(0)}70%{transform:translateY(-3px)}}
@keyframes droop{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(2px) rotate(-1.5deg)}}
@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}
@keyframes cheer{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.scene .sway{animation:sway 3.5s ease-in-out infinite}
.scene .twinkle{animation:twinkle 2s ease-in-out infinite}
.scene .glow{animation:glow 3s ease-in-out infinite}
.scene .flicker{animation:flicker .6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes fan{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.15)}}
.scene .fan{animation:fan .5s linear infinite}
.scene .spin{animation:spin 3s linear infinite} .scene .spin-slow{animation:spin 30s linear infinite}
.scene .tick{animation:spin 60s steps(60) infinite}
.scene .swim{animation:swim 5s ease-in-out infinite} .scene .swim2{animation:swim2 6s ease-in-out infinite}
.scene .bubble{animation:bubble 2.2s ease-in infinite;transform-box:fill-box}
.scene .breathe{animation:breathe 3.2s ease-in-out infinite}
.scene .zz{animation:zz 2.6s ease-in-out infinite}
.scene .bob{animation:floaty 3s ease-in-out infinite}
.scene .leaf{animation:sway 5s ease-in-out infinite}
.scene .wave{animation:sway 1.2s ease-in-out infinite}
.scene .ear{animation:sway 4s ease-in-out infinite}
@keyframes walk{0%,100%{transform:translateX(0)}50%{transform:translateX(7px)}}
@keyframes wag{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
.scene .walk{animation:walk 9s ease-in-out infinite}
.scene .wag{animation:wag .45s ease-in-out infinite}
.scene .wag-slow{animation:wag 2.4s ease-in-out infinite}
.scene .steam{animation:twinkle 2s ease-in-out infinite}
.scene .snow{animation:floaty 2.4s ease-in-out infinite}
.scene .neon{animation:twinkle 1.6s steps(2) infinite;filter:drop-shadow(0 0 2px #ff7fb0)}
.scene .hop{animation:hop 1s ease-out 2}
.scene .droop{animation:droop 2.4s ease-in-out infinite}
.scene .idle{animation:idle 2.6s ease-in-out infinite}
.scene .vet.cheer{animation:cheer 1.6s ease-in-out 3}
/* vistas de la ventana */
@keyframes wDrift{0%{transform:translateX(-42px);opacity:0}12%,88%{opacity:1}100%{transform:translateX(42px);opacity:0}}
@keyframes wFly{0%{transform:translate(-52px,4px)}25%{transform:translate(-16px,-3px)}50%{transform:translate(20px,2px)}75%{transform:translate(52px,-4px)}100%{transform:translate(88px,1px)}}
@keyframes wGrass{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
@keyframes wPulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:.75;transform:scale(1.14)}}
@keyframes wWave{0%,100%{transform:translateX(0)}50%{transform:translateX(-8px)}}
@keyframes wBob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(1.2px) rotate(2deg)}}
@keyframes wLeaf{0%{transform:translate(0,0) rotate(0);opacity:0}8%{opacity:1}25%{transform:translate(5px,15px) rotate(90deg)}50%{transform:translate(-5px,31px) rotate(180deg)}75%{transform:translate(4px,46px) rotate(270deg)}92%{opacity:1}100%{transform:translate(-7px,62px) rotate(340deg);opacity:0}}
@keyframes wSmoke{0%{transform:translate(0,0) scale(.6);opacity:0}20%{opacity:.9}100%{transform:translate(6px,-18px) scale(1.9);opacity:0}}
@keyframes wSnow{0%{transform:translate(0,-6px);opacity:0}10%{opacity:1}50%{transform:translate(4px,30px)}100%{transform:translate(-2px,66px);opacity:.5}}
@keyframes wShoot{0%,80%{transform:translate(0,0);opacity:0}84%{opacity:1}100%{transform:translate(-32px,16px);opacity:0}}
@keyframes wFirefly{0%,100%{transform:translate(0,0);opacity:.15}25%{transform:translate(3px,-3px);opacity:1}50%{transform:translate(-2px,-5px);opacity:.3}75%{transform:translate(-4px,-1px);opacity:.95}}
@keyframes wFog{0%,100%{transform:translateX(0)}50%{transform:translateX(-12px)}}
@keyframes wRoll{0%{transform:translateX(-10px);opacity:0}10%,90%{opacity:1}100%{transform:translateX(76px);opacity:0}}
@keyframes wBillow{0%,100%{transform:skewX(0) scaleX(1)}50%{transform:skewX(.9deg) scaleX(1.012)}}
@keyframes wSway{0%,100%{transform:rotate(0)}50%{transform:rotate(1.4deg)}}
@keyframes wEmber{0%{transform:translate(0,0);opacity:0}15%{opacity:1}100%{transform:translate(5px,-28px);opacity:0}}
@keyframes mote{0%,100%{transform:translate(0,0);opacity:0}25%,75%{opacity:.9}50%{transform:translate(7px,-9px)}}
.scene .w-drift{animation:wDrift 50s linear infinite}
.scene .w-fly{animation:wFly 16s linear infinite}
.scene .w-grass{animation:wGrass 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.scene .w-pulse{animation:wPulse 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.scene .w-wave{animation:wWave 4s ease-in-out infinite}
.scene .w-bob{animation:wBob 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.scene .w-leaf{animation:wLeaf 7s linear infinite;transform-box:fill-box;transform-origin:center}
.scene .w-smoke{animation:wSmoke 3.9s ease-out infinite;transform-box:fill-box;transform-origin:center}
.scene .w-snow{animation:wSnow 6s linear infinite}
.scene .w-shoot{animation:wShoot 7s ease-in infinite}
.scene .w-firefly{animation:wFirefly 3.2s ease-in-out infinite}
.scene .w-fog{animation:wFog 9s ease-in-out infinite}
.scene .w-roll{animation:wRoll 11s linear infinite}
.scene .w-spin-fast{animation:spin 1.2s linear infinite;transform-box:fill-box;transform-origin:center}
.scene .w-billow{animation:wBillow 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}
.scene .w-sway{animation:wSway 6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}
.scene .w-ember{animation:wEmber 2.8s ease-out infinite}
.scene .mote{animation:mote 7s ease-in-out infinite}
/* pacientes */
@keyframes ptBlink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes ptHead{0%,100%{transform:rotate(0)}35%{transform:rotate(-3deg)}70%{transform:rotate(2deg)}}
@keyframes ptNod{0%,100%{transform:rotate(0)}50%{transform:rotate(2.5deg)}}
@keyframes earFlick{0%,86%,100%{transform:rotate(0)}90%{transform:rotate(-14deg)}94%{transform:rotate(6deg)}}
.scene .pt-blink{animation:ptBlink 4.6s infinite;transform-box:fill-box;transform-origin:50% 55%}
.scene .pt-head{animation:ptHead 6s ease-in-out infinite}
.scene .pt-nod{animation:ptNod 4.4s ease-in-out infinite}
.scene .ear-flick{animation:earFlick 5.4s ease-in-out infinite}
.scene .ear-twitch{animation:earFlick 6.8s ease-in-out infinite 1.2s}
/* tu personaje: respira, mueve la cabeza, parpadea y balancea los brazos; saluda cuando aciertas */
@keyframes avBreathe{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-.5px) scale(1.008,1.014)}}
@keyframes avHead{0%,100%{transform:rotate(0)}25%{transform:rotate(-2.5deg)}55%{transform:rotate(0)}75%{transform:rotate(2deg)}}
@keyframes avBlink{0%,94%,100%{transform:scaleY(1)}96.5%{transform:scaleY(.08)}}
@keyframes avArmL{0%,100%{transform:rotate(0)}50%{transform:rotate(2.4deg)}}
@keyframes avArmR{0%,100%{transform:rotate(0)}50%{transform:rotate(-2.4deg)}}
@keyframes avWave{0%,100%{transform:rotate(0)}14%{transform:rotate(-150deg)}24%{transform:rotate(-126deg)}34%{transform:rotate(-152deg)}44%{transform:rotate(-126deg)}54%{transform:rotate(-150deg)}70%{transform:rotate(0)}}
.av-up{animation:avBreathe 3.8s ease-in-out infinite;transform-origin:60px 134px}
.av-head{animation:avHead 8s ease-in-out infinite;transform-origin:60px 80px}
.av-blink{animation:avBlink 4.8s infinite;transform-box:fill-box;transform-origin:50% 50%}
.av-arm-l{animation:avArmL 3.8s ease-in-out infinite;transform-origin:40px 94px}
.av-arm-r{animation:avArmR 3.8s ease-in-out infinite;transform-origin:80px 94px}
.cheer .av-arm-r,.dress-av .av-arm-r{animation:avWave 2.8s ease-in-out .4s 1}
.thumb svg *,.mini-pet *,.bub .face .av-head{animation:none!important}

@media (max-width:380px){.g-rep-top span{display:none}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media print{
  #tabs,.seg,.chips,.btn,.link,.navbar,.icon-btn{display:none!important}
  body{background:#fff;color:#000} .paper,.qa,.card{box-shadow:none;border-color:#bbb;break-inside:avoid-page}
  .wrap{padding:0} #app>*{animation:none!important}
}
